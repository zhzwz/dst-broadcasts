ignorePaths:
  - .git
  - bun.lock
  - dist
  - modinfo/language
  - node_modules
  - package.json
  - scripts/broadcasts/language

ignoreWords:
  - dont
  - zhzwz

words:
  - bearger # 熊獾
  - currenthealth
  - deerclops # 独眼巨鹿
  - forumthread
  - hassler
  - hungerdelta # 饱食度组件事件
  - inventoryitem # 可进背包的物品组件
  - ismastersim
  - luamin
  - minhealth
  - modimport
  - modmain
  - modname
  - moisturedelta # 湿度组件事件
  - overheattemp # 过热温度
  - playerghost # 玩家幽灵
  - sanitydelta # 理智组件事件
  - startfreezing # 温度组件事件：开始冻结
  - startoverheating # 温度组件事件：开始过热
  - steamworks
  - temperaturedelta # 温度组件事件
